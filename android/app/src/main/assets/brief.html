<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocl · Problem Brief</title>
<link rel="stylesheet" href="css/vocl-theme.css">
<style>
  .top-bar {
    position: sticky; top: 0; z-index: 40; background: rgba(0,0,0,0.92); backdrop-filter: blur(16px);
    height: 54px; padding: 0 16px; display: flex; align-items: center; gap: 12px;
    max-width: 520px; margin: 0 auto;
  }
  .back-btn {
    width: 36px; height: 36px; border: none; background: transparent; color: #FFFFFF;
    display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer;
  }
  .back-btn:active { background: rgba(255,255,255,0.1); }
  .top-title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }

  .page { padding-top: 8px; }

  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pills { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .duration { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

  .title-block { display: flex; flex-direction: column; gap: 10px; }
  .problem-title { font-size: 30px; font-weight: 700; line-height: 1.12; letter-spacing: -0.03em; color: #FFFFFF; }
  .problem-tagline { font-size: 15px; color: var(--muted); line-height: 1.4; }

  .challenge-section { display: flex; flex-direction: column; gap: 10px; }
  .section-heading { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .statement { font-size: 15.5px; line-height: 1.5; color: var(--text-secondary); }

  .io-row { display: flex; align-items: baseline; gap: 14px; font-size: 13.5px; line-height: 1.45; }
  .io-key { width: 64px; flex-shrink: 0; font-weight: 600; font-size: 12px; letter-spacing: 0.04em; color: #FFFFFF; }
  .io-key.out { color: var(--blue-soft); }
  .io-val { color: #FFFFFF; word-break: break-word; }
  .io-val.out { color: var(--blue-soft); }

  .constraints-list { display: flex; flex-direction: column; gap: 6px; }
  .constraint-item { font-size: 14px; color: #F2F2F7; line-height: 1.45; }
  .target-line { font-size: 14px; font-weight: 600; color: var(--green); }

  /* Accordion */
  .accordion-btn {
    width: 100%; background: transparent; border: none; color: #FFFFFF;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    cursor: pointer; text-align: left; padding: 0;
  }
  .accordion-title { font-size: 15px; font-weight: 600; }
  .accordion-chevron { color: var(--muted); transition: transform 0.2s ease; flex-shrink: 0; }
  .accordion-btn.open .accordion-chevron { transform: rotate(180deg); color: var(--green); }
  .accordion-body {
    display: none; flex-direction: column; gap: 8px;
    padding-top: 12px; border-top: 1px solid var(--surface-border);
  }
  .accordion-body.open { display: flex; }
  .objective-item { font-size: 13.5px; color: var(--text-secondary); line-height: 1.45; display: flex; gap: 8px; }
  .objective-dot { color: var(--amber); font-weight: 700; }

  .cta-block { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 6px; padding-bottom: 8px; }
  .start-btn {
    width: 100%; height: 56px; border: none; border-radius: 18px;
    background: var(--green); color: #000000;
    font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
    padding: 0 22px; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .start-btn:active { transform: scale(0.985); opacity: 0.92; }
  .start-btn-left { display: flex; align-items: center; gap: 12px; }
  .lock-hint { font-size: 12.5px; color: #6E6E73; text-align: center; }
</style>
<script src="js/vocl-bridge.js"></script>
</head>
<body>

<header class="top-bar">
  <button class="back-btn" onclick="navigateTo('drills.html')" aria-label="Back to Drills">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <span class="top-title">The brief</span>
</header>

<main class="page">
  <div class="meta-row">
    <div class="pills">
      <span class="pill cat" id="brief-cat">DSA</span>
      <span class="pill medium" id="brief-diff">Medium</span>
    </div>
    <div class="duration">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      <span id="brief-duration">10 min</span>
    </div>
  </div>

  <div class="title-block">
    <h1 class="problem-title" id="brief-title">Loading…</h1>
    <p class="problem-tagline" id="brief-tagline">Find the pattern. Defend the trade-offs.</p>
  </div>

  <div class="divider"></div>

  <section class="challenge-section">
    <h2 class="section-heading">Your challenge</h2>
    <p class="statement" id="brief-statement">Loading problem statement…</p>
  </section>

  <section class="card mono" id="io-card">
    <div class="io-row">
      <span class="io-key">INPUT</span>
      <span class="io-val" id="io-input">"babad"</span>
    </div>
    <div class="io-row">
      <span class="io-key out">OUTPUT</span>
      <span class="io-val out" id="io-output">"bab" (or "aba")</span>
    </div>
  </section>

  <section class="card">
    <span class="card-label mono">CONSTRAINTS TO DEFEND</span>
    <div class="constraints-list mono" id="constraints-list"></div>
    <div class="divider"></div>
    <div class="target-line" id="brief-target">Target: O(N)</div>
  </section>

  <section class="card">
    <button class="accordion-btn" id="hints-btn" onclick="toggleHints()" aria-expanded="false">
      <div>
        <div class="card-label mono" style="margin-bottom:4px;">HINTS &amp; OBJECTIVES</div>
        <div class="accordion-title">Edge cases &amp; rubric checkpoints</div>
      </div>
      <svg class="accordion-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <div class="accordion-body" id="hints-body"></div>
  </section>

  <section class="cta-block">
    <button class="start-btn" id="start-session-btn" onclick="beginSession()">
      <span class="start-btn-left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
        <span id="start-btn-label">Start audio session</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </button>
    <p class="lock-hint">Lock your phone after starting. I'll stay with you.</p>
  </section>
</main>

<script>renderBottomNav('drills');</script>

<script>
var problemId = getQueryParam('id') || 'longest-palindrome';

function toggleHints() {
  var btn = document.getElementById('hints-btn');
  var body = document.getElementById('hints-body');
  var isOpen = body.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  btn.setAttribute('aria-expanded', String(isOpen));
}

function beginSession() {
  if (!problemId) return;
  var label = document.getElementById('start-btn-label');
  if (label) label.textContent = 'Starting audio…';
  startSession(problemId);
  navigateTo('live.html?id=' + encodeURIComponent(problemId));
}

function renderProblem(p) {
  var fallback = getFallbackProblemById(p.id);
  document.getElementById('brief-cat').textContent = p.category;
  document.getElementById('brief-duration').textContent = p.duration_min + ' min';
  document.getElementById('brief-title').textContent = p.title;
  document.getElementById('brief-statement').textContent = p.statement;
  document.getElementById('brief-tagline').textContent = p.tagline || fallback.tagline || 'Find the pattern. Defend the trade-offs.';

  var diffEl = document.getElementById('brief-diff');
  diffEl.textContent = p.difficulty;
  diffEl.className = 'pill ' + (p.difficulty || 'medium').toLowerCase();

  document.getElementById('io-input').textContent = p.example_input || fallback.example_input || 'Verbal walk-through';
  document.getElementById('io-output').textContent = p.example_output || fallback.example_output || p.optimal_complexity;

  var list = document.getElementById('constraints-list');
  list.innerHTML = '';
  (p.constraints || []).forEach(function(c) {
    var row = document.createElement('div');
    row.className = 'constraint-item';
    row.textContent = c;
    list.appendChild(row);
  });

  var hintsBody = document.getElementById('hints-body');
  hintsBody.innerHTML = '';
  var edgeCases = (p.key_edge_cases && p.key_edge_cases.length) ? p.key_edge_cases : (fallback.key_edge_cases || []);
  edgeCases.forEach(function(item) {
    var el = document.createElement('div');
    el.className = 'objective-item';
    el.innerHTML = '<span class="objective-dot">&bull;</span><span>' + escapeHtml(item) + '</span>';
    hintsBody.appendChild(el);
  });

  document.getElementById('brief-target').textContent = 'Target: ' + p.optimal_complexity;
}

function loadProblem() {
  fetch(getBackendUrl() + '/api/problems/' + encodeURIComponent(problemId))
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(p) {
      setOfflineBadge(false);
      renderProblem(p);
    })
    .catch(function() {
      setOfflineBadge(true);
      renderProblem(getFallbackProblemById(problemId));
    });
}

loadProblem();
</script>
</body>
</html>
