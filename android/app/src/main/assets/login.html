<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocl · Sign In</title>
<link rel="stylesheet" href="css/vocl-theme.css">
<style>
  .login-page {
    max-width: 440px; min-height: 100dvh; margin: 0 auto;
    padding: 48px 24px calc(36px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; justify-content: space-between; gap: 32px;
  }
  .hero { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; margin-top: 24px; }
  .logo-badge {
    width: 64px; height: 64px; border-radius: 18px; border: 1px solid var(--surface-border);
    box-shadow: 0 12px 32px rgba(40, 215, 99, 0.12);
  }
  .headline { font-size: 34px; font-weight: 700; line-height: 1.08; letter-spacing: -0.035em; }
  .headline span { color: var(--green); }
  .subtitle { font-size: 15.5px; color: var(--muted); line-height: 1.5; }

  .actions { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .btn-google {
    width: 100%; height: 54px; border-radius: 16px; border: 1px solid #303036;
    background: #FFFFFF; color: #000000; font-size: 15.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn-google:active { transform: scale(0.985); opacity: 0.9; }
  .btn-dev {
    width: 100%; height: 54px; border-radius: 16px; border: 1px solid rgba(40, 215, 99, 0.45);
    background: rgba(40, 215, 99, 0.10); color: var(--green);
    font-size: 15.5px; font-weight: 700; cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn-dev:active { transform: scale(0.985); background: rgba(40, 215, 99, 0.20); }
  .btn-dev:disabled, .btn-google:disabled { opacity: 0.5; }
  .quota-note { text-align: center; font-size: 12.5px; color: #6E6E73; margin-top: 6px; }
</style>
<script src="js/vocl-bridge.js"></script>
</head>
<body>

<main class="login-page">
  <section class="hero">
    <img class="logo-badge" src="img/vocl-logo.png" alt="Vocl logo">
    <h1 class="headline">Think it.<br>Say it. <span>Defend it.</span></h1>
    <p class="subtitle">
      Sign in to save your interview autopsies, track rubric scores across sessions, and unlock 15 minutes of daily live voice practice.
    </p>
  </section>

  <section class="actions">
    <button type="button" class="btn-google" id="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5H1.2v3.1C3.2 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.2c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2V6.7H1.2C.4 8.3 0 10.1 0 12s.4 3.7 1.2 5.3l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C18 1.2 15.2 0 12 0 7.3 0 3.2 2.7 1.2 6.7l4 3.1c.9-2.9 3.6-5 6.8-5z"/></svg>
      Continue with Google
    </button>

    <button type="button" class="btn-dev" id="dev-btn" onclick="signInAsLocalDev()">
      Continue as Local Dev
    </button>

    <p class="quota-note mono" id="backend-note">Pocket Mode &bull; 15 min/day free voice quota</p>
  </section>
</main>

<script>
// Hide local dev bypass only on prod flavor when not explicitly needed
(function initLogin() {
  if (getAuthToken()) {
    navigateTo('drills.html');
    return;
  }
  if (window.VoclNative && !isLocalFlavor()) {
    // Keep dev button available only if backend enables DEV_AUTH_BYPASS; hide by default on prod
    document.getElementById('dev-btn').style.display = 'none';
  }
})();

function signInAsLocalDev() {
  var btn = document.getElementById('dev-btn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  voclApiJson('/api/auth/dev-login', 'POST', {
    email: 'yogesh@vocl.local',
    name: 'Yogesh Mali'
  })
    .then(function(data) {
      if (!data || !data.access_token) throw new Error('Missing access_token');
      saveAuthToken(data.access_token);
      if (data.user) {
        localStorage.setItem('voclUser', JSON.stringify(data.user));
      }
      navigateTo('drills.html');
    })
    .catch(function() {
      showToast('Sign-in failed — check backend connection');
      btn.disabled = false;
      btn.textContent = 'Continue as Local Dev';
    });
}

function signInWithGoogle() {
  // Native Credential Manager OAuth hooks in when GOOGLE_CLIENT_ID is configured
  showToast('Google OAuth requires GOOGLE_CLIENT_ID — use Local Dev for local builds');
}
</script>
</body>
</html>
