<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocl · Sign In</title>
<link rel="stylesheet" href="css/vocl-theme.css">
<style>
  .login-page {
    max-width: 440px; min-height: 100dvh; margin: 0 auto;
    padding: 36px 24px calc(32px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; justify-content: space-between; gap: 22px;
  }
  .hero { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .logo-badge {
    width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--surface-border);
    box-shadow: 0 12px 32px rgba(40, 215, 99, 0.12);
  }
  .headline { font-size: 32px; font-weight: 700; line-height: 1.08; letter-spacing: -0.035em; }
  .headline span { color: var(--green); }
  .subtitle { font-size: 14.5px; color: var(--muted); line-height: 1.48; }

  .auth-stack { display: flex; flex-direction: column; gap: 16px; width: 100%; }

  .btn-google {
    width: 100%; height: 52px; border-radius: 14px; border: 1px solid #303036;
    background: #FFFFFF; color: #000000; font-size: 15.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn-google:active { transform: scale(0.985); }
  .btn-google:disabled { opacity: 0.55; }

  .inline-error {
    display: none; padding: 11px 14px; border-radius: 12px;
    background: rgba(255, 69, 58, 0.12); border: 1px solid rgba(255, 69, 58, 0.36);
    color: #FF6961; font-size: 13px; line-height: 1.4;
  }
  .inline-error.visible { display: block; }

  .or-divider {
    display: flex; align-items: center; gap: 12px;
    color: #6E6E73; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .or-divider::before, .or-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--surface-border);
  }

  .auth-card {
    background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px;
    padding: 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input {
    height: 46px; border-radius: 12px; border: 1px solid var(--surface-border);
    background: #08080A; color: #FFFFFF; padding: 0 14px; font-size: 15px; outline: none;
  }
  .field input:focus { border-color: var(--green); }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 2px; }
  .btn-primary {
    height: 46px; border-radius: 14px; border: none;
    background: var(--green); color: #000000; font-size: 14.5px; font-weight: 700; cursor: pointer;
  }
  .btn-secondary {
    height: 46px; border-radius: 14px; border: 1px solid var(--surface-border);
    background: #18181C; color: #FFFFFF; font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.5; }

  .quota-note { text-align: center; font-size: 12px; color: #6E6E73; }
</style>
<script src="js/vocl-bridge.js"></script>
</head>
<body>

<main class="login-page">
  <section class="hero">
    <img class="logo-badge" src="img/vocl-logo.png" alt="Vocl logo">
    <h1 class="headline">Think it.<br>Say it. <span>Defend it.</span></h1>
    <p class="subtitle">
      Sign in to save your interview autopsies, track rubric scores, and unlock 15 minutes of daily live voice practice.
    </p>
  </section>

  <section class="auth-stack">
    <button type="button" class="btn-google" id="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5H1.2v3.1C3.2 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.2c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2V6.7H1.2C.4 8.3 0 10.1 0 12s.4 3.7 1.2 5.3l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C18 1.2 15.2 0 12 0 7.3 0 3.2 2.7 1.2 6.7l4 3.1c.9-2.9 3.6-5 6.8-5z"/></svg>
      <span id="google-btn-label">Continue with Google</span>
    </button>

    <div class="inline-error" id="auth-error" role="alert"></div>

    <div class="or-divider" id="or-divider">or</div>

    <section class="auth-card" id="supabase-form-card">
      <span class="card-label mono">EMAIL SIGN IN</span>
      <div class="field">
        <label for="email-input">Email</label>
        <input id="email-input" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password-input">Password</label>
        <input id="password-input" type="password" autocomplete="current-password" placeholder="At least 6 characters">
      </div>
      <div class="btn-row">
        <button type="button" class="btn-primary" id="signin-btn" onclick="submitSupabaseAuth('signin')">Sign In</button>
        <button type="button" class="btn-secondary" id="signup-btn" onclick="submitSupabaseAuth('signup')">Sign Up</button>
      </div>
    </section>
  </section>

  <p class="quota-note mono">Pocket Mode &bull; 15 min/day free voice quota</p>
</main>

<script>
var authConfig = { supabase_url: '', supabase_key: '', google_client_id: '' };

function showAuthError(msg) {
  var box = document.getElementById('auth-error');
  if (!msg) {
    box.textContent = '';
    box.classList.remove('visible');
    return;
  }
  box.textContent = msg;
  box.classList.add('visible');
}

function setGoogleButtonLoading(loading) {
  var btn = document.getElementById('google-btn');
  var label = document.getElementById('google-btn-label');
  btn.disabled = loading;
  label.textContent = loading ? 'Signing in with Google…' : 'Continue with Google';
}

function setEmailButtonsDisabled(disabled) {
  document.getElementById('signin-btn').disabled = disabled;
  document.getElementById('signup-btn').disabled = disabled;
}

function loadAuthConfig() {
  return voclApiJson('/api/auth/config').then(function(cfg) {
    authConfig = cfg || authConfig;
    var hasEmail = Boolean(authConfig.supabase_url && authConfig.supabase_key);
    document.getElementById('supabase-form-card').style.display = hasEmail ? 'flex' : 'none';
    document.getElementById('or-divider').style.display = hasEmail ? 'flex' : 'none';
    return authConfig;
  });
}

(function initLogin() {
  if (getAuthToken()) {
    navigateTo('drills.html');
    return;
  }
  loadAuthConfig().catch(function() {});
})();

window.onVoclGoogleSignInSuccess = function() {
  showAuthError('');
  setGoogleButtonLoading(false);
  navigateTo('drills.html');
};

window.onVoclGoogleSignInError = function(message) {
  setGoogleButtonLoading(false);
  showAuthError(message || 'Google Sign-In failed. Please try again.');
};

function signInWithGoogle() {
  showAuthError('');
  if (!window.VoclNative || typeof window.VoclNative.startGoogleSignIn !== 'function') {
    showAuthError('Native Google Sign-In is only available inside the Vocl Android app.');
    return;
  }

  setGoogleButtonLoading(true);
  var cfgPromise = authConfig.google_client_id ? Promise.resolve(authConfig) : loadAuthConfig();
  cfgPromise
    .then(function(cfg) {
      var clientId = cfg && cfg.google_client_id ? String(cfg.google_client_id).trim() : '';
      if (!clientId) {
        setGoogleButtonLoading(false);
        showAuthError('Google Sign-In is not configured on this server yet.');
        return;
      }
      window.VoclNative.startGoogleSignIn(clientId);
    })
    .catch(function() {
      setGoogleButtonLoading(false);
      showAuthError('Could not reach the Vocl backend. Check your connection and retry.');
    });
}

function submitSupabaseAuth(mode) {
  showAuthError('');
  var email = (document.getElementById('email-input').value || '').trim();
  var password = document.getElementById('password-input').value || '';
  if (!email || password.length < 6) {
    showAuthError('Enter a valid email and a password with at least 6 characters.');
    return;
  }
  if (!authConfig.supabase_url || !authConfig.supabase_key) {
    showAuthError('Email sign-in is not configured on this backend.');
    return;
  }

  setEmailButtonsDisabled(true);
  var endpoint = mode === 'signup' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
  voclSupabaseAuthPost(authConfig.supabase_url, authConfig.supabase_key, endpoint, {
    email: email,
    password: password
  })
    .then(function(data) {
      var token = data.access_token || (data.session && data.session.access_token);
      if (!token) {
        showToast('Account created — check your email to confirm');
        return;
      }
      saveAuthToken(token);
      navigateTo('drills.html');
    })
    .catch(function(err) {
      showAuthError(err && err.message ? err.message : 'Authentication failed.');
    })
    .finally(function() {
      setEmailButtonsDisabled(false);
    });
}
</script>
</body>
</html>
