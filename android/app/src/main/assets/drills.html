<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocl · Drills</title>
<style>
  :root {
    --bg: #000000;
    --surface: #141416;
    --surface-border: #242428;
    --green: #28D763;
    --blue: #9AB8FF;
    --amber: #EBA65A;
    --text: #FFFFFF;
    --muted: #8E8E93;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; min-height: 100vh; }
  ::-webkit-scrollbar { display: none; }

  .page { max-width: 520px; margin: 0 auto; padding: 20px 20px 96px; display: flex; flex-direction: column; gap: 22px; }

  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 6px; }
  .hero-headline { font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -0.03em; color: #FFFFFF; }
  .streak-pill {
    flex-shrink: 0; padding: 7px 14px; border-radius: 9999px;
    background: rgba(235, 166, 90, 0.08); border: 1px solid rgba(235, 166, 90, 0.45);
    color: var(--amber); font-size: 12.5px; font-weight: 600; letter-spacing: -0.01em; margin-top: 2px;
  }

  .featured-card {
    background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px;
    padding: 22px; display: flex; flex-direction: column; gap: 10px; cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .featured-card:active { transform: scale(0.985); border-color: #34343A; }
  .featured-title { font-size: 22px; font-weight: 700; line-height: 1.25; letter-spacing: -0.025em; color: #FFFFFF; }
  .featured-sub { font-size: 14.5px; color: var(--muted); line-height: 1.4; }
  .featured-cta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; color: var(--green); font-size: 14.5px; font-weight: 600; }

  .filter-row { display: flex; align-items: center; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
  .filter-pill {
    flex-shrink: 0; padding: 10px 18px; border-radius: 9999px;
    background: #161618; border: 1px solid var(--surface-border);
    color: var(--muted); font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-pill.active { background: var(--green); border-color: var(--green); color: #000000; }

  .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px; }
  .section-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .section-count { font-size: 13px; color: var(--muted); }

  .drill-list { display: flex; flex-direction: column; gap: 14px; }
  .drill-card {
    background: var(--surface); border: 1px solid var(--surface-border); border-radius: 18px;
    padding: 18px; display: flex; align-items: center; gap: 16px; cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .drill-card:active { transform: scale(0.985); border-color: #34343A; }

  .icon-tile {
    width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-tile.dsa { background: rgba(40, 215, 99, 0.11); color: var(--green); }
  .icon-tile.system { background: rgba(154, 184, 255, 0.11); color: var(--blue); }
  .icon-tile.devops { background: rgba(235, 166, 90, 0.11); color: var(--amber); }

  .drill-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .drill-title { font-size: 17px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; color: #FFFFFF; }
  .drill-meta { font-size: 12px; color: var(--muted); letter-spacing: 0.01em; }
  .chevron { flex-shrink: 0; color: #6E6E73; }
</style>
<script src="js/vocl-bridge.js"></script>
</head>
<body>

<main class="page">
  <header class="top-row">
    <h1 class="hero-headline">Think it.<br>Say it. Defend it.</h1>
    <div class="streak-pill" id="streak-pill">3-day streak</div>
  </header>

  <section class="featured-card" id="featured-card" onclick="openFeatured()">
    <div class="featured-title" id="featured-title">Longest palindromic substring.</div>
    <div class="featured-sub" id="featured-sub">10 minutes of thinking out loud.</div>
    <div class="featured-cta">
      <span>Find your next drill</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </div>
  </section>

  <div class="filter-row" id="filter-row">
    <button class="filter-pill active" data-cat="ALL" onclick="setFilter('ALL')">All drills</button>
    <button class="filter-pill" data-cat="DSA" onclick="setFilter('DSA')">DSA</button>
    <button class="filter-pill" data-cat="System Design" onclick="setFilter('System Design')">System design</button>
    <button class="filter-pill" data-cat="DevOps" onclick="setFilter('DevOps')">DevOps</button>
  </div>

  <div class="section-header">
    <h2 class="section-title">Choose your challenge</h2>
    <span class="section-count" id="drill-count">3 drills</span>
  </div>

  <section class="drill-list" id="drill-list"></section>
</main>

<script>renderBottomNav('drills');</script>

<script>
var allProblems = [];
var activeCategory = 'ALL';
var featuredProblemId = 'longest-palindrome';

function categoryStyle(cat) {
  if (cat === 'System Design') {
    return {
      cls: 'system',
      label: 'SYSTEM DESIGN',
      icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 12 12 17 22 12"></polyline><polyline points="2 17 12 22 22 17"></polyline></svg>'
    };
  }
  if (cat === 'DevOps') {
    return {
      cls: 'devops',
      label: 'DEVOPS',
      icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><line x1="7" y1="7.5" x2="7.01" y2="7.5"></line><line x1="7" y1="16.5" x2="7.01" y2="16.5"></line></svg>'
    };
  }
  return {
    cls: 'dsa',
    label: 'DSA',
    icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline><line x1="14" y1="4" x2="10" y2="20"></line></svg>'
  };
}

function openFeatured() {
  if (featuredProblemId) navigateTo('brief.html?id=' + encodeURIComponent(featuredProblemId));
}

function setFilter(cat) {
  activeCategory = cat;
  var pills = document.querySelectorAll('.filter-pill');
  pills.forEach(function(p) {
    if (p.getAttribute('data-cat') === cat) p.classList.add('active');
    else p.classList.remove('active');
  });
  renderDrills();
}

function renderFeatured(problem) {
  if (!problem) return;
  featuredProblemId = problem.id;
  var title = problem.title.endsWith('.') ? problem.title : problem.title + '.';
  document.getElementById('featured-title').textContent = title;
  document.getElementById('featured-sub').textContent = problem.duration_min + ' minutes of thinking out loud.';
}

function renderDrills() {
  var filtered = allProblems.filter(function(p) {
    return activeCategory === 'ALL' || p.category === activeCategory;
  });

  document.getElementById('drill-count').textContent = filtered.length + (filtered.length === 1 ? ' drill' : ' drills');

  var list = document.getElementById('drill-list');
  list.innerHTML = '';

  filtered.forEach(function(p) {
    var style = categoryStyle(p.category);
    var card = document.createElement('div');
    card.className = 'drill-card';
    card.onclick = function() { navigateTo('brief.html?id=' + encodeURIComponent(p.id)); };
    card.innerHTML =
      '<div class="icon-tile ' + style.cls + '">' + style.icon + '</div>' +
      '<div class="drill-info">' +
        '<div class="drill-title">' + p.title + '</div>' +
        '<div class="drill-meta">' + style.label + ' &middot; ' + p.difficulty + ' &middot; ' + p.duration_min + ' min</div>' +
      '</div>' +
      '<svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
    list.appendChild(card);
  });
}

function initDrills() {
  fetch(getBackendUrl() + '/api/problems')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      allProblems = Array.isArray(data) && data.length ? data : VOCL_FALLBACK_PROBLEMS;
      var featured = allProblems.find(function(p) { return p.id === 'longest-palindrome'; }) || allProblems[0];
      renderFeatured(featured);
      renderDrills();
    })
    .catch(function() {
      allProblems = VOCL_FALLBACK_PROBLEMS;
      renderFeatured(allProblems[0]);
      renderDrills();
    });
}

initDrills();
</script>
</body>
</html>
