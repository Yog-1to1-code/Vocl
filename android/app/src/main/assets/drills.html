<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocl · Drills</title>
<link rel="stylesheet" href="css/vocl-theme.css">
<style>
  .brand-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 2px; }
  .brand-lockup { display: flex; align-items: center; gap: 9px; }
  .brand-logo { width: 26px; height: 26px; border-radius: 7px; border: 1px solid #242428; }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #FFFFFF; }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .hero-headline { font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -0.03em; color: #FFFFFF; }

  .rec-section { display: flex; flex-direction: column; gap: 12px; }
  .rec-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rec-title { font-size: 16px; font-weight: 700; letter-spacing: -0.015em; color: #FFFFFF; }
  .weak-chip {
    padding: 4px 10px; border-radius: var(--radius-pill);
    background: rgba(255, 159, 10, 0.12); border: 1px solid rgba(255, 159, 10, 0.34);
    color: var(--amber); font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  }
  .rec-list { display: flex; flex-direction: column; gap: 10px; }
  .rec-card {
    background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px;
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .rec-card:first-child { border-color: rgba(40, 215, 99, 0.38); }
  .rec-card:active { transform: scale(0.985); border-color: var(--green); }
  .rec-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .rec-reason { font-size: 11.5px; font-weight: 600; color: var(--green); }
  .rec-reason.retry { color: var(--amber); }
  .rec-name { font-size: 15.5px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.015em; }
  .rec-meta { font-size: 12px; color: var(--muted); }

  .filter-row { display: flex; align-items: center; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
  .filter-pill {
    flex-shrink: 0; padding: 10px 18px; border-radius: var(--radius-pill);
    background: #161618; border: 1px solid var(--surface-border);
    color: var(--muted); font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-pill.active { background: var(--green); border-color: var(--green); color: #000000; }

  .section-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; }
  .section-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .section-actions { display: flex; align-items: center; gap: 10px; }
  .section-count { font-size: 13px; color: var(--muted); }
  .shuffle-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: var(--radius-pill);
    background: var(--surface); border: 1px solid var(--surface-border);
    color: #FFFFFF; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .shuffle-btn:active { transform: scale(0.95); border-color: var(--green); color: var(--green); }

  .drill-list { display: flex; flex-direction: column; gap: 12px; }
  .drill-card {
    background: var(--surface); border: 1px solid var(--surface-border); border-radius: 18px;
    padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .drill-card:active { transform: scale(0.985); border-color: #34343A; }

  .icon-tile {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-tile.dsa { background: rgba(40, 215, 99, 0.11); color: var(--green); }
  .icon-tile.system { background: rgba(10, 132, 255, 0.12); color: var(--blue-soft); }
  .icon-tile.debugging { background: rgba(255, 159, 10, 0.12); color: var(--amber); }

  .drill-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .drill-title { font-size: 16px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; color: #FFFFFF; }
  .drill-meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .drill-meta { font-size: 12px; color: var(--muted); letter-spacing: 0.01em; }
  .score-badge {
    padding: 2px 8px; border-radius: var(--radius-pill);
    background: rgba(40, 215, 99, 0.12); border: 1px solid rgba(40, 215, 99, 0.30);
    color: var(--green); font-size: 11px; font-weight: 700;
  }
  .score-badge.low {
    background: rgba(255, 159, 10, 0.12); border-color: rgba(255, 159, 10, 0.32); color: var(--amber);
  }
  .chevron { flex-shrink: 0; color: #6E6E73; }
</style>
<script src="js/vocl-bridge.js"></script>
</head>
<body>

<main class="page">
  <div class="brand-bar">
    <div class="brand-lockup">
      <img class="brand-logo" src="img/vocl-logo.png" alt="Vocl logo">
      <span class="brand-name">Vocl</span>
    </div>
    <div class="streak-pill" id="streak-pill">Ready</div>
  </div>

  <header class="top-row">
    <h1 class="hero-headline">Think it.<br>Say it. Defend it.</h1>
  </header>

  <section class="rec-section" id="rec-section" style="display:none;">
    <div class="rec-header">
      <h2 class="rec-title">Recommended for Your Commute</h2>
      <span class="weak-chip mono" id="weak-chip" style="display:none;"></span>
    </div>
    <div class="rec-list" id="rec-list"></div>
  </section>

  <div class="filter-row" id="filter-row">
    <button class="filter-pill active" data-cat="ALL" onclick="setFilter('ALL')">All</button>
    <button class="filter-pill" data-cat="DSA" onclick="setFilter('DSA')">DSA</button>
    <button class="filter-pill" data-cat="System Design" onclick="setFilter('System Design')">System Design</button>
    <button class="filter-pill" data-cat="Debugging" onclick="setFilter('Debugging')">Debugging</button>
  </div>

  <div class="section-header">
    <h2 class="section-title">Commute track</h2>
    <div class="section-actions">
      <span class="section-count" id="drill-count">30 drills</span>
      <button class="shuffle-btn" id="shuffle-btn" onclick="shuffleDrills()" aria-label="Shuffle drills">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        Shuffle
      </button>
    </div>
  </div>

  <section class="drill-list" id="drill-list"></section>
</main>

<script>renderBottomNav('drills');</script>

<script>
var allProblems = [];
var activeCategory = 'ALL';

var DIMENSION_LABELS = {
  correctness: 'Correctness',
  complexity: 'Complexity',
  edge_cases: 'Edge Cases',
  communication: 'Communication'
};

function categoryStyle(cat) {
  if (cat === 'System Design') {
    return {
      cls: 'system',
      label: 'SYSTEM DESIGN',
      icon: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 12 12 17 22 12"></polyline><polyline points="2 17 12 22 22 17"></polyline></svg>'
    };
  }
  if (cat === 'Debugging' || cat === 'DevOps') {
    return {
      cls: 'debugging',
      label: 'DEBUGGING',
      icon: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><line x1="7" y1="7.5" x2="7.01" y2="7.5"></line><line x1="7" y1="16.5" x2="7.01" y2="16.5"></line></svg>'
    };
  }
  return {
    cls: 'dsa',
    label: 'DSA',
    icon: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline><line x1="14" y1="4" x2="10" y2="20"></line></svg>'
  };
}

function setFilter(cat) {
  activeCategory = cat;
  document.querySelectorAll('.filter-pill').forEach(function(p) {
    p.classList.toggle('active', p.getAttribute('data-cat') === cat);
  });
  renderDrills();
}

function shuffleDrills() {
  if (allProblems.length < 2) return;
  var firstId = allProblems[0].id;
  for (var i = allProblems.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = allProblems[i];
    allProblems[i] = allProblems[j];
    allProblems[j] = tmp;
  }
  if (allProblems[0].id === firstId) {
    allProblems.push(allProblems.shift());
  }
  renderDrills();
  showToast('Drills shuffled');
}

function renderRecommendations(rec) {
  var section = document.getElementById('rec-section');
  var list = document.getElementById('rec-list');
  var chip = document.getElementById('weak-chip');
  if (!rec || !Array.isArray(rec.queue) || rec.queue.length === 0) {
    section.style.display = 'none';
    return;
  }

  if (typeof rec.streak_days === 'number') {
    document.getElementById('streak-pill').textContent = rec.streak_days > 0 ? rec.streak_days + '-day streak' : 'Start streak';
  }
  if (rec.weakest_dimension && DIMENSION_LABELS[rec.weakest_dimension]) {
    chip.textContent = 'Focus: ' + DIMENSION_LABELS[rec.weakest_dimension];
    chip.style.display = 'inline-block';
  } else {
    chip.style.display = 'none';
  }

  list.innerHTML = '';
  rec.queue.forEach(function(item) {
    var card = document.createElement('div');
    card.className = 'rec-card';
    card.onclick = function() { navigateTo('brief.html?id=' + encodeURIComponent(item.problem_id)); };
    var reasonCls = item.slot === 'retry' ? 'rec-reason retry' : 'rec-reason';
    card.innerHTML =
      '<div class="rec-info">' +
        '<div class="' + reasonCls + '">' + escapeHtml(item.reason) + '</div>' +
        '<div class="rec-name">' + escapeHtml(item.title) + '</div>' +
        '<div class="rec-meta">' + escapeHtml(item.category) + ' &middot; ' + escapeHtml(item.difficulty) + ' &middot; ' + escapeHtml(item.duration_min) + ' min</div>' +
      '</div>' +
      '<svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
    list.appendChild(card);
  });
  section.style.display = 'flex';
}

function matchesCategory(problemCategory, filter) {
  if (filter === 'ALL') return true;
  if (filter === 'Debugging') return problemCategory === 'Debugging' || problemCategory === 'DevOps';
  return problemCategory === filter;
}

function renderDrills() {
  var filtered = allProblems.filter(function(p) {
    return matchesCategory(p.category, activeCategory);
  });

  document.getElementById('drill-count').textContent = filtered.length + (filtered.length === 1 ? ' drill' : ' drills');

  var list = document.getElementById('drill-list');
  list.innerHTML = '';

  filtered.forEach(function(p) {
    var style = categoryStyle(p.category);
    var card = document.createElement('div');
    card.className = 'drill-card';
    card.onclick = function() { navigateTo('brief.html?id=' + encodeURIComponent(p.id)); };

    var badgeHtml = '';
    if (p.attempts_count && p.attempts_count > 0 && p.best_score !== null && p.best_score !== undefined) {
      var lowCls = Number(p.best_score) < 7 ? ' low' : '';
      badgeHtml = '<span class="score-badge mono' + lowCls + '">Best ' + escapeHtml(p.best_score) + '/10 &middot; ' + escapeHtml(p.attempts_count) + 'x</span>';
    }

    card.innerHTML =
      '<div class="icon-tile ' + style.cls + '">' + style.icon + '</div>' +
      '<div class="drill-info">' +
        '<div class="drill-title">' + escapeHtml(p.title) + '</div>' +
        '<div class="drill-meta-row">' +
          '<span class="drill-meta">' + escapeHtml(style.label) + ' &middot; ' + escapeHtml(p.difficulty) + ' &middot; ' + escapeHtml(p.duration_min) + ' min</span>' +
          badgeHtml +
        '</div>' +
      '</div>' +
      '<svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
    list.appendChild(card);
  });
}

function loadRecommendations() {
  voclApiJson('/api/recommendations')
    .then(function(rec) { renderRecommendations(rec); })
    .catch(function() {
      document.getElementById('streak-pill').textContent = 'Commute ready';
    });
}

function initDrills() {
  voclApiJson('/api/problems')
    .then(function(data) {
      setOfflineBadge(false);
      allProblems = Array.isArray(data) && data.length ? data : VOCL_FALLBACK_PROBLEMS.slice();
      renderDrills();
    })
    .catch(function() {
      setOfflineBadge(true);
      allProblems = VOCL_FALLBACK_PROBLEMS.slice();
      renderDrills();
    });
  loadRecommendations();
}

initDrills();
</script>
</body>
</html>
