<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#000;color:#f2f2f7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:24px}
  .orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#a29bfe,#6C5CE7);box-shadow:0 0 60px rgba(108,92,231,0.4);transition:all 0.6s ease}
  .orb.listening{background:radial-gradient(circle at 30% 30%,#a29bfe,#6C5CE7);box-shadow:0 0 60px rgba(108,92,231,0.4);animation:pulse 3s ease-in-out infinite}
  .orb.speaking{background:radial-gradient(circle at 30% 30%,#6cff82,#30d158);box-shadow:0 0 80px rgba(48,209,88,0.5);animation:pulse 1.5s ease-in-out infinite}
  .orb.analyzing{background:radial-gradient(circle at 30% 30%,#ffb868,#ffa11a);box-shadow:0 0 80px rgba(255,161,26,0.5);animation:spin 2s linear infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @keyframes spin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.05)}100%{transform:rotate(360deg) scale(1)}}
  .status-label{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#8e8e93;transition:color 0.3s}
  .stop-btn{margin-top:24px;padding:16px 40px;border:none;border-radius:9999px;background:#ff453a;color:white;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s}
  .stop-btn:active{transform:scale(0.95);opacity:0.9}
</style>
<script src="js/vocl-bridge.js"></script>
</head>
<body>

<div class="orb listening" id="orb"></div>
<span class="status-label" id="status-label">CONNECTING…</span>
<button class="stop-btn" onclick="endInterview()">End Interview</button>

<script>
var orb = document.getElementById('orb');
var label = document.getElementById('status-label');
var sessionEnded = false;

window.onVoclStateChange = function(status) {
  orb.className = 'orb ' + status;
  var labels = { listening: 'LISTENING…', speaking: 'SPEAKING…', analyzing: 'ANALYZING…' };
  label.textContent = labels[status] || status.toUpperCase();
  label.style.color = status === 'speaking' ? '#30d158' : status === 'analyzing' ? '#ffa11a' : '#8e8e93';
};

window.onVoclSessionComplete = function(autopsy) {
  sessionEnded = true;
  label.textContent = 'SESSION COMPLETE';
  orb.className = 'orb';
  orb.style.background = 'radial-gradient(circle at 30% 30%, #6cff82, #30d158)';
  orb.style.animation = 'none';
  try { localStorage.setItem('lastAutopsy', JSON.stringify(autopsy)); } catch(e){}
};

function endInterview() {
  if (sessionEnded) { navigateTo('drills.html'); return; }
  stopSession();
  label.textContent = 'ENDING SESSION…';
  setTimeout(function() { if (!sessionEnded) navigateTo('drills.html'); }, 6000);
}
</script>
</body>
</html>
