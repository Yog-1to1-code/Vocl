<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocl · Profile</title>
<link rel="stylesheet" href="css/vocl-theme.css">
<style>
  .top-row { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
  .page-title { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
  .page-sub { font-size: 15px; color: var(--muted); }

  .profile-header { display: flex; align-items: center; gap: 16px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
    background: rgba(40, 215, 99, 0.14); border: 1.5px solid rgba(40, 215, 99, 0.45);
    color: var(--green); font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
    display: flex; align-items: center; justify-content: center;
  }
  .profile-identity { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .profile-name { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .profile-role { font-size: 13.5px; color: var(--muted); word-break: break-all; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 14px; align-items: center; padding-top: 2px; }
  .v-sep { height: 34px; background: var(--surface-border); }
  .stat-cell { display: flex; flex-direction: column; gap: 3px; }
  .stat-val { font-size: 22px; font-weight: 700; color: #FFFFFF; line-height: 1.1; }
  .stat-lbl { font-size: 12px; color: var(--muted); }

  .quota-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .quota-val { font-size: 14px; font-weight: 600; color: var(--green); }
  .bar-track { height: 6px; border-radius: 9999px; background: #26262A; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 9999px; background: var(--green); transition: width 0.3s ease; }

  .pref-sub { font-size: 13px; color: var(--muted); line-height: 1.45; }

  .action-stack { display: flex; flex-direction: column; gap: 10px; }
  .reset-btn {
    width: 100%; height: 48px; border-radius: 14px;
    background: rgba(255, 69, 58, 0.06); border: 1px solid rgba(255, 69, 58, 0.45);
    color: var(--red); font-size: 14.5px; font-weight: 600; cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .reset-btn:active { transform: scale(0.985); background: rgba(255, 69, 58, 0.16); }
  .reset-btn:disabled { opacity: 0.5; }
  .signout-btn {
    width: 100%; height: 48px; border-radius: 14px;
    background: #161618; border: 1px solid var(--surface-border);
    color: #FFFFFF; font-size: 14.5px; font-weight: 600; cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .signout-btn:active { transform: scale(0.985); border-color: #3A3A42; }
</style>
<script src="js/vocl-bridge.js"></script>
</head>
<body>

<main class="page">
  <header class="top-row">
    <h1 class="page-title">Profile</h1>
    <p class="page-sub">Pocket mode ready.</p>
  </header>

  <section class="card">
    <div class="profile-header">
      <div class="avatar mono" id="user-initials">YM</div>
      <div class="profile-identity">
        <div class="profile-name" id="user-name">Yogesh Mali</div>
        <div class="profile-role" id="user-email">yogesh@vocl.local</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="stats-grid">
      <div class="stat-cell">
        <span class="stat-val mono" id="stat-sessions">0</span>
        <span class="stat-lbl">Completed drills</span>
      </div>
      <div class="v-sep"></div>
      <div class="stat-cell">
        <span class="stat-val mono" id="stat-streak">0 days</span>
        <span class="stat-lbl">Active streak</span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="quota-row">
      <span class="card-label mono">DAILY VOICE QUOTA</span>
      <span class="quota-val mono" id="quota-remaining">15.0 min left</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="quota-bar" style="width:0%;"></div></div>
    <p class="pref-sub mono" id="quota-detail">0.0 / 15.0 min used today</p>
  </section>

  <section class="card">
    <span class="card-label mono">ACCOUNT &amp; SESSIONS</span>
    <p class="pref-sub">Reset your recorded interview history or sign out of this device.</p>
    <div class="action-stack">
      <button class="reset-btn" id="reset-btn" onclick="resetDemoSessions()">Reset Demo Sessions</button>
      <button class="signout-btn" id="signout-btn" onclick="signOut()">Sign Out</button>
    </div>
  </section>
</main>

<script>renderBottomNav('profile');</script>

<script>
function initialsFromName(name) {
  var parts = String(name || 'V').trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return parts[0].slice(0, 2).toUpperCase();
}

function renderProfile(user) {
  if (!user) return;
  document.getElementById('user-name').textContent = user.name || 'Vocl User';
  document.getElementById('user-email').textContent = user.email || '';
  document.getElementById('user-initials').textContent = initialsFromName(user.name || user.email);

  var used = Number(user.daily_minutes_used || 0);
  var limit = Number(user.daily_quota_minutes || 15);
  var remaining = Number(user.remaining_minutes != null ? user.remaining_minutes : Math.max(0, limit - used));
  var pct = limit > 0 ? Math.min(100, Math.round((used / limit) * 100)) : 0;

  document.getElementById('quota-remaining').textContent = remaining.toFixed(1) + ' min left';
  document.getElementById('quota-detail').textContent = used.toFixed(1) + ' / ' + limit.toFixed(1) + ' min used today';
  document.getElementById('quota-bar').style.width = pct + '%';
}

function loadUserProfile() {
  try {
    var cached = JSON.parse(localStorage.getItem('voclUser') || 'null');
    if (cached) renderProfile(cached);
  } catch (e) {}

  voclApiJson('/api/auth/me')
    .then(function(user) {
      localStorage.setItem('voclUser', JSON.stringify(user));
      renderProfile(user);
    })
    .catch(function() {});
}

function loadSessionStats() {
  voclApiJson('/api/sessions')
    .then(function(list) {
      var sessions = Array.isArray(list) ? list : [];
      var days = computeStreakDays(sessions);
      document.getElementById('stat-sessions').textContent = String(sessions.length);
      document.getElementById('stat-streak').textContent = days + (days === 1 ? ' day' : ' days');
    })
    .catch(function() {
      try {
        var local = JSON.parse(localStorage.getItem('voclSessions') || '[]');
        var days = computeStreakDays(local);
        document.getElementById('stat-sessions').textContent = String(local.length);
        document.getElementById('stat-streak').textContent = days + (days === 1 ? ' day' : ' days');
      } catch (e) {}
    });
}

function resetDemoSessions() {
  var btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.textContent = 'Clearing…';

  voclApiJson('/api/sessions', 'DELETE')
    .then(function() {
      localStorage.removeItem('voclSessions');
      localStorage.removeItem('lastAutopsy');
      document.getElementById('stat-sessions').textContent = '0';
      document.getElementById('stat-streak').textContent = '0 days';
      showToast('Demo sessions cleared');
    })
    .catch(function() {
      localStorage.removeItem('voclSessions');
      localStorage.removeItem('lastAutopsy');
      showToast('Cleared local cache (server offline)');
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = 'Reset Demo Sessions';
    });
}

function signOut() {
  clearAuthToken();
  localStorage.removeItem('voclSessions');
  localStorage.removeItem('lastAutopsy');
  navigateTo('login.html');
}

loadUserProfile();
loadSessionStats();
</script>
</body>
</html>
