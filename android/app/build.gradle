plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vocl.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vocl.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "env"
    productFlavors {
        prod {
            dimension "env"
            buildConfigField "String", "BACKEND_HOST", '"vocl.onrender.com"'
            buildConfigField "boolean", "USE_TLS", "true"
        }
        local {
            dimension "env"
            applicationIdSuffix ".local"
            buildConfigField "String", "BACKEND_HOST", '"127.0.0.1:8080"'
            buildConfigField "boolean", "USE_TLS", "false"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
